<h2 mat-dialog-title>Delete {{data.title}} </h2>

<mat-dialog-content>
  <p>Are you sure you want to delete the study <strong>{{ data.name }}</strong>?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button (click)="close()">Cancel</button>
  <button class="delete" mat-raised-button color="warn" (click)="delete()">Delete</button>
</mat-dialog-actions>
