name: Deploy to Firebase Hosting (wpu-ahcer)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ahcer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      # TODO(#45): once the CI test gate lands, run the test suite here
      # and let a failure block the deploy step below.

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT_WPU_AHCER" > "${{ runner.temp }}/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT_WPU_AHCER: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WPU_AHCER }}

      - name: Build and deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npm run deploy-prod
